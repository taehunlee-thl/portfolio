<div class="min-h-screen bg-ink">
  <header class="sticky top-0 z-40 border-b border-line bg-ink/95 backdrop-blur">
    <!-- Row 1: brand, primary nav, account -->
    <div class="mx-auto flex h-14 max-w-[1440px] items-center gap-6 px-4 sm:px-6">
      <a routerLink="/" class="flex shrink-0 items-center gap-2">
        <span class="font-display text-xl leading-none text-brass">P</span>
        <span class="hidden font-display text-lg tracking-tight text-fg sm:inline">PolemoX</span>
      </a>

      <nav class="hidden items-center gap-1 md:flex">
        <a
          routerLink="/"
          routerLinkActive="text-fg"
          [routerLinkActiveOptions]="{ exact: true }"
          class="rounded-md px-3 py-1.5 text-xs font-medium uppercase tracking-wider text-fg-muted transition-colors hover:text-fg"
        >
          Battles
        </a>
        <a
          routerLink="/explore"
          routerLinkActive="text-fg"
          class="rounded-md px-3 py-1.5 text-xs font-medium uppercase tracking-wider text-fg-muted transition-colors hover:text-fg"
        >
          Explore
        </a>
        <a
          routerLink="/rankings"
          routerLinkActive="text-fg"
          class="rounded-md px-3 py-1.5 text-xs font-medium uppercase tracking-wider text-fg-muted transition-colors hover:text-fg"
        >
          Rankings
        </a>
        <a
          routerLink="/market"
          routerLinkActive="text-fg"
          class="rounded-md px-3 py-1.5 text-xs font-medium uppercase tracking-wider text-fg-muted transition-colors hover:text-fg"
        >
          Market
        </a>
      </nav>

      <div class="hidden flex-1 justify-center px-4 lg:flex">
        <div class="w-full max-w-xs">
          <app-trader-search />
        </div>
      </div>

      <div class="flex items-center justify-end gap-2 lg:flex-none">
        @if (auth.currentUser(); as user) {
          <a
            routerLink="/sessions/new"
            class="hidden rounded-md border border-brass/40 px-3 py-1.5 text-xs font-medium text-brass transition-colors hover:bg-brass/10 sm:inline-block"
          >
            + New battle
          </a>
          <a
            routerLink="/dashboard"
            routerLinkActive="bg-panel-raised"
            class="rounded-md px-3 py-1.5 text-xs font-medium text-fg-muted transition-colors hover:bg-panel-raised hover:text-fg"
          >
            Dashboard
          </a>

          <div class="relative">
            <button
              type="button"
              (click)="toggleUserMenu()"
              class="flex items-center gap-2 rounded-md p-1 transition-colors hover:bg-panel-raised"
              [attr.aria-expanded]="userMenuOpen()"
              aria-haspopup="menu"
            >
              <app-level-badge [level]="user.level" [xpTotal]="user.xpTotal" [size]="30" />
              <span class="hidden text-xs text-fg lg:inline">{{ user.displayName }}</span>
            </button>

            @if (userMenuOpen()) {
              <div
                class="absolute right-0 top-full z-50 mt-1 w-44 rounded-md border border-line bg-panel-raised py-1 shadow-xl"
                role="menu"
              >
                <a
                  routerLink="/profile"
                  (click)="userMenuOpen.set(false)"
                  class="block px-3 py-2 text-xs text-fg-muted transition-colors hover:bg-panel hover:text-fg"
                  role="menuitem"
                >
                  Profile
                </a>
                <a
                  routerLink="/dashboard"
                  (click)="userMenuOpen.set(false)"
                  class="block px-3 py-2 text-xs text-fg-muted transition-colors hover:bg-panel hover:text-fg"
                  role="menuitem"
                >
                  My battles
                </a>
                <button
                  type="button"
                  (click)="signOut()"
                  class="block w-full px-3 py-2 text-left text-xs text-fg-muted transition-colors hover:bg-panel hover:text-loss"
                  role="menuitem"
                >
                  Sign out
                </button>
              </div>
            }
          </div>
        } @else {
          <button
            type="button"
            (click)="signIn()"
            class="rounded-md px-3 py-1.5 text-xs font-medium text-fg-muted transition-colors hover:text-fg"
          >
            Sign in
          </button>
          <button
            type="button"
            (click)="signUp()"
            class="rounded-md bg-brass px-4 py-1.5 text-xs font-medium text-brass-ink transition-opacity hover:opacity-90"
          >
            Sign up
          </button>
        }
      </div>
    </div>
  </header>

  <router-outlet />

  <!-- Rendered once for the whole app; any component can summon it via AuthModalService. -->
  <app-auth-modal />
</div>
